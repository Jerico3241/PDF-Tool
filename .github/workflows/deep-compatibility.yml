name: Deep Compatibility Test

# Vollständige historische Installer-Prüfung – NUR manuell und auf ausdrückliche Anforderung
# (nie bei Commits, Pull Requests oder Releases). Der normale Workflow »Windows-Setup« prüft nur
# Clean Install und das Update von der unmittelbar vorherigen stabilen Version; die Daten älterer
# Versionen prüft er schnell über Fixtures (tests/test_config_migration.py).
#
# Ablauf: das aktuelle Setup einmal bauen, dann je Vorversion ein frischer Windows-Rechner:
# veröffentlichtes Setup der Vorversion laden (nie neu bauen), installieren, Benutzerdaten anlegen,
# auf die aktuelle Version aktualisieren und prüfen (tests/smoke_installer.ps1 -Previous).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Vorversionen, kommagetrennt (z. B. 2.4.0,2.5.0) – leer: alle stabilen Releases ab 2.2.0 vor der aktuellen Version"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Aktuelles Setup bauen
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      current: ${{ steps.versions.outputs.current }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build-Pakete
        run: python -m pip install --disable-pip-version-check pillow PySide6-Essentials==6.11.2

      - name: Vorversionen bestimmen (stabile Releases, SemVer)
        id: versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.versions }}
        run: |
          $current = (Get-Content windows-app/VERSION -Raw).Trim()
          $versions = if ($env:ONLY) { python windows-app/releases.py all --repo "${{ github.repository }}" --only $env:ONLY --json } else { python windows-app/releases.py all --repo "${{ github.repository }}" --json }
          if ($LASTEXITCODE -ne 0) { throw "Vorversionen konnten nicht bestimmt werden" }
          Write-Host "Aktuelle Version: $current · Vorversionen: $versions"
          "current=$current" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "versions=$versions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Inno Setup 6 bereitstellen
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup bauen
        run: python windows-app/build.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDF-Tool-Setup-Deep-Compatibility
          path: |
            windows-app/dist/*.exe
            windows-app/dist/*.sha256
          if-no-files-found: error
          retention-days: 3

  upgrade:
    name: "Upgrade test: PDF Tool ${{ matrix.version }} → PDF Tool ${{ needs.build.outputs.current }}"
    needs: build
    if: needs.build.outputs.versions != '[]'
    runs-on: windows-latest
    timeout-minutes: 20 # je Vorversion; kein automatischer Neuversuch
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        version: ${{ fromJSON(needs.build.outputs.versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PDF-Tool-Setup-Deep-Compatibility
          path: neu

      - name: "Setup von PDF Tool ${{ matrix.version }} aus dem Zwischenspeicher"
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vorversion
          key: pdf-tool-setup-${{ matrix.version }}

      - name: "Setup von PDF Tool ${{ matrix.version }} laden (veröffentlichtes Release)"
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ matrix.version }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "vorversion"
          if ($env:CACHE_HIT -ne "true") {
            gh release download "v$env:PREVIOUS" --repo "${{ github.repository }}" --pattern "*Setup-$env:PREVIOUS.exe*" --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "Setup von PDF Tool $env:PREVIOUS konnte nicht geladen werden" }
          }
          $setup = Get-ChildItem $dir -Filter "*Setup-$env:PREVIOUS.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup von PDF Tool $env:PREVIOUS fehlt" }
          $expected = ((Get-Content "$($setup.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Prüfsumme des Setups von PDF Tool $env:PREVIOUS stimmt nicht: $actual" }
          "PREVIOUS_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "Upgrade test: PDF Tool ${{ matrix.version }} → PDF Tool ${{ needs.build.outputs.current }}"
        timeout-minutes: 15
        shell: pwsh
        run: |
          Write-Host "Upgrade test: PDF Tool ${{ matrix.version }} → PDF Tool ${{ needs.build.outputs.current }}"
          $setup = (Get-ChildItem neu/*.exe | Select-Object -First 1).FullName
          ./windows-app/tests/smoke_installer.ps1 -Setup $setup -Previous $env:PREVIOUS_SETUP
