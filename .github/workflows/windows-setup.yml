name: Windows-Setup

on:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/windows-setup.yml"
  pull_request:
    paths:
      - "windows-app/**"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/windows-setup.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Nach bestandenen Prüfungen das Release v<Version> (»PDF Tool <Version>«) mit Setup und SHA-256 veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    name: Setup bauen (Inno Setup)
    runs-on: windows-latest
    permissions:
      contents: write # nur für das Anhängen an ein Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build- und Testpakete
        run: python -m pip install --disable-pip-version-check pillow pytest pandas openpyxl reportlab xlrd pypdf xlwt pikepdf==10.15.0 pypdfium2==5.13.0

      - name: Tests (Kernlogik, Excel-Fettschrift, Rich Text, Datenübernahme, Kundenakte)
        run: python -m pytest windows-app/tests/test_core.py windows-app/tests/test_excel_bold.py windows-app/tests/test_richtext.py windows-app/tests/test_migration.py windows-app/tests/test_customers.py -q -p no:cacheprovider

      - name: Tests (PDF reparieren – Engine, Arbeitsprozess, Schadensfälle)
        run: python -m pytest windows-app/tests/test_pdf_repair.py -q -p no:cacheprovider

      - name: Tests (Oberfläche)
        run: python -m pytest windows-app/tests/test_app_ui.py windows-app/tests/test_app_v22.py windows-app/tests/test_app_v23.py windows-app/tests/test_app_v24.py -q -p no:cacheprovider

      - name: Inno Setup 6 bereitstellen
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          (Get-Item $iscc).VersionInfo.ProductVersion
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup bauen
        run: python windows-app/build.py

      - name: Eingebettete Laufzeit prüfen (Module, PDF, Programmstart)
        shell: pwsh
        run: |
          & ./windows-app/build/payload/runtime/python.exe -s windows-app/tests/smoke_runtime.py --app windows-app/build/payload/app --ui
          if ($LASTEXITCODE -ne 0) { throw "Prüfung der eingebetteten Laufzeit fehlgeschlagen" }

      - name: Setup still installieren, prüfen und deinstallieren
        shell: pwsh
        run: ./windows-app/tests/smoke_installer.ps1 -Setup (Get-ChildItem windows-app/dist/*.exe | Select-Object -First 1).FullName

      - name: Vorversion 2.2.0 laden (Übersichten-Ersteller)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "vorversion"
          $name = "Uebersichten-Ersteller-Setup-2.2.0.exe"
          gh release download v2.2.0 --repo "${{ github.repository }}" --pattern "$name*" --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "Vorversion konnte nicht geladen werden" }
          $expected = ((Get-Content (Join-Path $dir "$name.sha256") -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Prüfsumme der Vorversion stimmt nicht: $actual" }
          "PREVIOUS_SETUP=$(Join-Path $dir $name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Update von 2.2.0 prüfen (ein App-Eintrag, Ordner, Verknüpfungen, Datenübernahme)
        shell: pwsh
        run: ./windows-app/tests/smoke_installer.ps1 -Setup (Get-ChildItem windows-app/dist/*.exe | Select-Object -First 1).FullName -Previous $env:PREVIOUS_SETUP

      - name: Vorversion 2.3.0 laden (PDF Tool)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "vorversion-2.3"
          $name = "PDF-Tool-Setup-2.3.0.exe"
          gh release download v2.3.0 --repo "${{ github.repository }}" --pattern "$name*" --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "Vorversion 2.3.0 konnte nicht geladen werden" }
          $expected = ((Get-Content (Join-Path $dir "$name.sha256") -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Prüfsumme der Vorversion 2.3.0 stimmt nicht: $actual" }
          "PREVIOUS_SETUP_23=$(Join-Path $dir $name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Update von 2.3.0 prüfen (Kundenverlauf → Kundenakten mit Sicherung, Formatierung, Standard-Fußzeile, Vorlagen)
        shell: pwsh
        run: ./windows-app/tests/smoke_installer.ps1 -Setup (Get-ChildItem windows-app/dist/*.exe | Select-Object -First 1).FullName -Previous $env:PREVIOUS_SETUP_23

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Tool-Setup
          path: |
            windows-app/dist/*.exe
            windows-app/dist/*.sha256
          if-no-files-found: error

      - name: An Release anhängen
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem windows-app/dist/*.exe, windows-app/dist/*.sha256) --clobber

  release:
    name: Release veröffentlichen
    needs: setup
    # nur manuell auf main und nur, wenn alle Tests, der Build und die Setup-Prüfungen bestanden sind
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PDF-Tool-Setup
          path: dist

      - name: Tag und Release v<Version> erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < windows-app/VERSION)"
          tag="v${version}"
          setup="PDF-Tool-Setup-${version}.exe"
          notes="windows-app/release-notes/${version}.md"
          test -f "dist/${setup}" || { echo "Setup fehlt: ${setup}" >&2; exit 1; }
          test -f "dist/${setup}.sha256" || { echo "Prüfsumme fehlt" >&2; exit 1; }
          test -f "${notes}" || { echo "Release Notes fehlen: ${notes}" >&2; exit 1; }
          (cd dist && sha256sum -c "${setup}.sha256")
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} existiert bereits – nichts verändert." >&2
            exit 1
          fi
          gh release create "${tag}" "dist/${setup}" "dist/${setup}.sha256" \
            --target "${GITHUB_SHA}" --title "PDF Tool ${version}" --notes-file "${notes}" --latest
          gh release view "${tag}"
