name: Windows-Setup

# Vollständige Prüfung – bei jedem Pull Request und nach jedem Merge auf main (Push); manuell auch
# für den aktuellen Stand eines Zweigs:
#   1. Tests – Kernlogik, Vorlagen, Regelwerk, Sicherung/Wiederherstellung, Diagnose,
#      Datenmigration älterer Einstellungen (Fixtures 2.2.0 … 2.7.2), PDF reparieren, Updater
#      (lokaler Testserver, nie Live-GitHub), PDF Editor; die Qt-Oberflächentests laufen gleichzeitig
#      in fünf eigenen Jobs (je ein eigener Rechner)
#   2. Setup bauen (prüft Setup, Prüfsumme, Version und Release Notes)
#   3. Clean-Install-Test der neuen Version
#   4. Upgrade-Test: unmittelbar vorherige stabile Version → neue Version (nach SemVer ermittelt,
#      veröffentlichtes Setup, zwischengespeichert – nie ein altes Setup neu bauen)
#   5. Runtime-Smoke-Test  6. QML-Smoke-Test
#   7. Updater-E2E-Test: Mock-Release → Download → SHA-256 → bereit → Start des Setups über den
#      Hilfsprozess (Inno-Setup-Attrappe); nur lesend HTTPS zu GitHub (Schannel)
#   8. Nur auf main und nur, wenn alles bestanden ist: Release Candidate speichern – genau das
#      geprüfte Setup und seine Prüfsumme als Artifact »PDF-Tool-Release-Candidate-<Commit-SHA>«
#      mit Manifest (Commit, Lauf, Version, SHA-256), 90 Tage aufbewahrt.
# Veröffentlicht wird nur über den Workflow »Release« (release.yml): Er lädt den Release Candidate
# eines erfolgreichen main-Laufs für genau den Release-Commit und veröffentlicht ihn unverändert –
# ohne neuen Build und ohne erneute Tests (Beta vor Stable, Hotfix-Regel, unveränderliche Releases).
# Keine historische Update-Matrix: ältere Versionen prüft nur der manuelle Workflow
# »Deep Compatibility Test« (deep-compatibility.yml).

on:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/windows-setup.yml"
  pull_request:
    paths:
      - "windows-app/**"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/windows-setup.yml"
  # Erneuter vollständiger Lauf – z. B. wenn der Release Candidate eines main-Stands abgelaufen ist
  # oder ein Commit auf main wegen der Pfadfilter keinen Lauf hatte
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push in denselben Pull Request ersetzt den laufenden Lauf; main und manuelle Läufe
# laufen immer zu Ende.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qt-tests:
    name: "1. Qt-Tests (${{ matrix.gruppe }})"
    runs-on: windows-latest
    timeout-minutes: 30 # je Gruppe normal 6–8 Minuten; ein hängender Test bricht früh ab
    strategy:
      fail-fast: false
      matrix:
        include:
          - gruppe: Start, Navigation, Einstellungen, Updates, Verlauf, optionale Kundenakte
            dateien: resources bridge shell history optional updates
          - gruppe: Vertragsübersichten, Kopf- und Fußzeile, PDF reparieren
            dateien: contracts richtext repair
          - gruppe: Kundenakte, Stapel, Einfügemarke
            dateien: customers batch caret
          - gruppe: Vorlagen, Regelwerk, Sicherung und Diagnose
            dateien: templates rules backup
          - gruppe: PDF Reader & Editor
            dateien: reader objects reader_layout reader_motion
    env:
      DATEIEN: ${{ matrix.dateien }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Testpakete
        # lxml (von pikepdf mitinstalliert) gehört nicht zur Laufzeit der App – die Tests laufen ohne, wie das Setup
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow pytest pandas openpyxl reportlab xlrd pypdf==6.19.0 xlwt pikepdf==10.15.0 pypdfium2==5.13.0 PySide6-Essentials==6.11.2 fonttools==4.66.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip uninstall --disable-pip-version-check -y lxml

      - name: Tests (Qt-Oberfläche ohne Bildschirm – Controller, QML, Ressourcen, Abläufe)
        timeout-minutes: 25
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Jede Testdatei in einem eigenen Prozess: jede meldet ihre Fehler vollständig, und ein
          # Absturz zeigt den laufenden Test (-v) – alle Dateien laufen, auch nach einem Fehler.
          $failed = @()
          foreach ($name in $env:DATEIEN -split '\s+') {
            python -m pytest "windows-app/tests/test_qt_$name.py" -v -rfE -p no:cacheprovider
            if ($LASTEXITCODE -ne 0) { $failed += $name }
          }
          "QT_FEHLGESCHLAGEN=$($failed -join ' ')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($failed.Count -gt 0) { throw "Qt-Tests fehlgeschlagen: $(($failed | ForEach-Object { "test_qt_$_.py" }) -join ', ')" }

      - name: Absturzanalyse der Qt-Tests (nur nach einem Fehler – nativer Aufrufstapel mit cdb)
        if: failure()
        timeout-minutes: 30
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_INFO: "1" # Grafik-API und Render-Schleife ausgeben
          PDFTOOL_QML_DEBUG: "1" # alle Qt-Meldungen ausgeben
          PDFTOOL_LAYOUT_DEBUG: "1" # bei »Detected recursive rearrange«: letzte Layout-Schritte und alle Karten
        run: |
          $cdb = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "cdb.exe nicht vorhanden – keine Absturzanalyse"; exit 0 }
          $script = Join-Path $env:RUNNER_TEMP "absturz.cdb"
          @(
            '.symfix+ C:\symbols',
            'sxe -c ".echo === Zugriffsverletzung (erste Chance) ===; kn 40; g" -c2 ".echo === Zugriffsverletzung (unbehandelt) ===; .ecxr; kn 80; q" av',
            'g'
          ) | Set-Content -Path $script -Encoding ascii
          # fehlgeschlagene Dateien; brach der Testschritt ab (z. B. Zeitlimit), alle Dateien der Gruppe
          $names = if ("$env:QT_FEHLGESCHLAGEN".Trim()) { $env:QT_FEHLGESCHLAGEN } else { $env:DATEIEN }
          foreach ($name in $names -split '\s+' | Where-Object { $_ }) {
            Write-Host "=== test_qt_$name.py unter cdb ==="
            & $cdb -G -lines -cf $script python -m pytest "windows-app/tests/test_qt_$name.py" -x -v -s -p no:cacheprovider -p no:faulthandler
          }
          exit 0

  setup:
    name: Setup bauen und prüfen (Inno Setup)
    runs-on: windows-latest
    timeout-minutes: 40 # normal etwa 7 Minuten
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build- und Testpakete
        # lxml (von pikepdf mitinstalliert) gehört nicht zur Laufzeit der App – die Tests laufen ohne, wie das Setup
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow pytest pandas openpyxl reportlab xlrd pypdf==6.19.0 xlwt pikepdf==10.15.0 pypdfium2==5.13.0 PySide6-Essentials==6.11.2 fonttools==4.66.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip uninstall --disable-pip-version-check -y lxml

      - name: 1. Tests (Kernlogik, Excel-Fettschrift, Rich Text, Datenübernahme, Kundenakte, Stapel, Vertragsvergleich, Versionswahl, Release-Prüfung, Updater-Kern)
        run: python -m pytest windows-app/tests/test_core.py windows-app/tests/test_excel_bold.py windows-app/tests/test_richtext.py windows-app/tests/test_migration.py windows-app/tests/test_customers.py windows-app/tests/test_batch.py windows-app/tests/test_history.py windows-app/tests/test_releases.py windows-app/tests/test_updater.py -q -p no:cacheprovider

      - name: 1. Tests (Vorlagen 2.0, Regelwerk 2.0 samt PDF-Pipeline, Sicherung und Wiederherstellung, Diagnose und Support-Paket)
        run: python -m pytest windows-app/tests/test_templates.py windows-app/tests/test_rules.py windows-app/tests/test_rules_pipeline.py windows-app/tests/test_backup.py windows-app/tests/test_diagnostics.py -v -p no:cacheprovider

      - name: 1. Tests (Updater mit lokalem Testserver – Download, SHA-256, Abbruch, Offline, Zeitlimits, Weiterleitungen, Cache, Hilfsprozess)
        timeout-minutes: 10 # normal unter einer Minute; ein hängender Test bricht früh ab
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest windows-app/tests/test_updater_flow.py -v -p no:cacheprovider

      - name: 1. Tests (Datenmigration älterer Einstellungen 2.2.0 … 2.7.2 – Fixtures statt alter Setups)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest windows-app/tests/test_config_migration.py -v -p no:cacheprovider

      - name: 1. Tests (PDF Editor – Kern, Speichern, Text bearbeiten, Seiten, Bilder, Anmerkungen, Formulare, Eigenschaften)
        run: python -m pytest windows-app/tests/test_editor_core.py windows-app/tests/test_editor_save.py windows-app/tests/test_editor_text.py windows-app/tests/test_editor_objects.py windows-app/tests/test_editor_pages.py windows-app/tests/test_editor_images.py windows-app/tests/test_editor_annotations.py windows-app/tests/test_editor_forms.py windows-app/tests/test_editor_properties.py -q -p no:cacheprovider

      - name: 1. Tests (PDF reparieren – Engine, Arbeitsprozess, Schadensfälle, erweiterte Wiederherstellung)
        run: python -m pytest windows-app/tests/test_pdf_repair.py windows-app/tests/test_pdf_recovery.py windows-app/tests/test_pdf_repair_batch.py -q -p no:cacheprovider

      - name: Inno Setup 6 bereitstellen
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          (Get-Item $iscc).VersionInfo.ProductVersion
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 2. Setup bauen
        run: python windows-app/build.py

      - name: Release-Dateien prüfen (Namen, Version, Prüfsumme gehört zum Setup, Release Notes)
        run: python windows-app/release_check.py windows-app/dist

      - name: Versionen des Update-Tests ermitteln (vorherige stabile Version nach SemVer)
        id: versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = (Get-Content windows-app/VERSION -Raw).Trim()
          $previous = python windows-app/releases.py previous --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0 -or -not $previous) { throw "Keine vorherige stabile Version gefunden" }
          $previous = "$previous".Trim()
          $setup = (Get-ChildItem windows-app/dist/*.exe | Select-Object -First 1).FullName
          Write-Host "Clean install: PDF Tool $current"
          Write-Host "Upgrade test: PDF Tool $previous → PDF Tool $current"
          "current=$current" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous=$previous" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "### Installer-Tests",
            "- Clean Install: **PDF Tool $current**",
            "- Upgrade test: **PDF Tool $previous → PDF Tool $current**",
            "- Ältere Versionen: Datenmigration über Fixtures (test_config_migration.py); historische Setups nur im manuellen Workflow »Deep Compatibility Test«"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: "3. Clean-Install-Test: PDF Tool ${{ steps.versions.outputs.current }} (still installieren, prüfen, deinstallieren)"
        timeout-minutes: 15
        shell: pwsh
        run: |
          Write-Host "Clean install: PDF Tool ${{ steps.versions.outputs.current }}"
          ./windows-app/tests/smoke_installer.ps1 -Setup $env:SETUP

      - name: "Setup von PDF Tool ${{ steps.versions.outputs.previous }} aus dem Zwischenspeicher"
        id: previous-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vorversion
          key: pdf-tool-setup-${{ steps.versions.outputs.previous }}

      - name: "Setup von PDF Tool ${{ steps.versions.outputs.previous }} laden (veröffentlichtes Release, nie neu gebaut)"
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.versions.outputs.previous }}
          CACHE_HIT: ${{ steps.previous-cache.outputs.cache-hit }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "vorversion"
          if ($env:CACHE_HIT -ne "true") {
            gh release download "v$env:PREVIOUS" --repo "${{ github.repository }}" --pattern "*Setup-$env:PREVIOUS.exe*" --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "Setup von PDF Tool $env:PREVIOUS konnte nicht geladen werden" }
          } else {
            Write-Host "Aus dem Zwischenspeicher: $(Get-ChildItem $dir -Name)"
          }
          $setup = Get-ChildItem $dir -Filter "*Setup-$env:PREVIOUS.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup von PDF Tool $env:PREVIOUS fehlt" }
          $expected = ((Get-Content "$($setup.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Prüfsumme des Setups von PDF Tool $env:PREVIOUS stimmt nicht: $actual" }
          "PREVIOUS_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "4. Upgrade-Test: PDF Tool ${{ steps.versions.outputs.previous }} → PDF Tool ${{ steps.versions.outputs.current }} (ein App-Eintrag, Benutzerdaten erhalten)"
        timeout-minutes: 15 # kein automatischer Neuversuch: ein Fehler wird gemeldet
        shell: pwsh
        run: |
          Write-Host "Upgrade test: PDF Tool ${{ steps.versions.outputs.previous }} → PDF Tool ${{ steps.versions.outputs.current }}"
          ./windows-app/tests/smoke_installer.ps1 -Setup $env:SETUP -Previous $env:PREVIOUS_SETUP

      - name: 5. Runtime-Smoke-Test (eingebettete Laufzeit – Module, PDF, Kundenakte, Vorschau, Stapel, Vergleich, Reparatur)
        timeout-minutes: 10
        shell: pwsh
        run: |
          & ./windows-app/build/payload/runtime/python.exe -s windows-app/tests/smoke_runtime.py --app windows-app/build/payload/app --part runtime
          if ($LASTEXITCODE -ne 0) { throw "Runtime-Smoke-Test fehlgeschlagen" }

      - name: 6. QML-Smoke-Test (Oberfläche aus der Ressource, Programmstart mit Fenster, Werkzeuge und Ansichten)
        timeout-minutes: 10
        shell: pwsh
        run: |
          & ./windows-app/build/payload/runtime/python.exe -s windows-app/tests/smoke_runtime.py --app windows-app/build/payload/app --part ui --ui
          if ($LASTEXITCODE -ne 0) { throw "QML-Smoke-Test fehlgeschlagen" }

      - name: "7. Updater-E2E-Test (Mock-Release → Download → SHA-256 → bereit → Setup-Start über den Hilfsprozess; HTTPS zu GitHub nur lesend)"
        timeout-minutes: 10
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "updater-test"
          & $env:ISCC /Q "/O$fake" windows-app/tests/fixtures/fake-update-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Setup-Attrappe konnte nicht gebaut werden" }
          & ./windows-app/build/payload/runtime/python.exe -s windows-app/tests/smoke_updater.py --app windows-app/build/payload/app --fake-setup (Join-Path $fake "fake-update-setup.exe") --live
          if ($LASTEXITCODE -ne 0) { throw "Updater-E2E-Test fehlgeschlagen" }

      # Setup dieses Laufs (auch zum Ausprobieren eines Pull Requests); auf main übernimmt Schritt 8
      # genau diese Dateien als Release Candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDF-Tool-Setup-${{ github.sha }}
          path: |
            windows-app/dist/*.exe
            windows-app/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: 8. Release Candidate speichern (main)
    needs: [qt-tests, setup]
    # nur auf main (Push oder manueller Lauf) und nur, wenn alle Tests, der Build und alle
    # Installer-Prüfungen dieses Laufs bestanden sind
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Geprüftes Setup dieses Laufs übernehmen (kein neuer Build)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PDF-Tool-Setup-${{ github.sha }}
          path: rc

      - name: Release Candidate prüfen und dem Commit zuordnen (Manifest – Commit, Lauf, Version, SHA-256)
        run: python3 windows-app/release_candidate.py write rc --commit "${GITHUB_SHA}" --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDF-Tool-Release-Candidate-${{ github.sha }}
          path: rc/
          if-no-files-found: error
          retention-days: 90 # lange genug für Beta- und Stable-Freigaben; danach erneuter main-Lauf
