version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  # Pakete der Windows-Laufzeit (windows-app/runtime-requirements.txt, gepinnt mit SHA-256): einmal im
  # Monat alle Versionsupdates gebündelt in einem Pull Request. Sicherheitsupdates bleiben möglich –
  # Intervall, Gruppe und Limit gelten nur für Versionsupdates.
  - package-ecosystem: "pip"
    directory: "/windows-app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-laufzeit:
        patterns:
          - "*"
