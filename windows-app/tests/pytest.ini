[pytest]
# Ausgaben auf Python-Ebene abfangen statt auf Ebene der Datei-Handles (--capture=fd).
# Eingeführt für die frühere tkinter-Oberfläche (bis 2.6): fd-Capture schloss unter Windows
# Handles, die Tcl zwischengespeichert hatte. Die Qt-Tests laufen seit 2.7 mit derselben
# Einstellung; eine Umstellung auf fd-Capture ist bisher nicht geprüft.
addopts = --capture=sys
# Hängt ein Test (z. B. eine endlose Ereignisschleife der Oberfläche), nach 5 Minuten die
# Stacks aller Threads ausgeben – statt ohne Hinweis bis zum Abbruch der CI zu warten.
faulthandler_timeout = 300
