[pytest]
# Ausgaben auf Python-Ebene abfangen statt auf Ebene der Datei-Handles (--capture=fd):
# Unter Windows schließt fd-Capture zwischen den Testphasen die Handles, die Tcl für
# seine Standardkanäle zwischengespeichert hat. Vergibt Windows diese Handle-Werte neu,
# scheitert ein späteres tkinter.Tk() gelegentlich mitten in der Initialisierung
# (»Can't find a usable tk.tcl … couldn't read file …«).
addopts = --capture=sys
